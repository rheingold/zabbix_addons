### Zabbix Agent2 - Aggplugin Configuration Template
### Deploy to: [ZABBIX_HOME]/conf/zabbix_agent2.d/plugins.d/aggplugin.conf
###
### Common Zabbix installation paths:
### - Windows: C:\Program Files\Zabbix Agent 2\conf\zabbix_agent2.d\plugins.d\
### - Windows: C:\Zabbix\conf\zabbix_agent2.d\plugins.d\
### - Linux: /etc/zabbix/zabbix_agent2.d/plugins.d/

### IMPORTANT: External plugins (standalone executables) cannot use Configure() interface
### Configuration is read by custom parser in main.go at startup
### Priority: plugin config > main agent config > hardcoded defaults

## External Plugin Registration
## Path to the external plugin executable (REQUIRED)
## Note: Must use "System.Path" parameter for external plugins
## Adjust path to match your Zabbix plugin directory:
Plugins.Aggplugin.System.Path=[ZABBIX_HOME]/plugins/aggplugin-agent2.exe

## Debug Level
## Controls verbosity of plugin logging
## Log location attempts (in order):
##   1. [ZABBIX_HOME]/log/aggplugin_debug.log
##   2. C:\Program Files\Zabbix Agent 2\log\aggplugin_debug.log
##   3. Current directory (fallback)
## Values: 0=Fatal/None, 1=Error, 2=Warning, 3=Info, 4=Verbose, 5=VeryVerbose
## Default: 0 (Fatal errors only)
## Uncomment to enable INFO level logging (recommended for troubleshooting):
Plugins.Aggplugin.DebugLevel=3

## Alternative: Set DebugLevel globally in main agent config (zabbix_agent2.conf)
## This will be read if plugin-specific setting is not defined:
# DebugLevel=3

## Maximum Samples
## Maximum number of samples to aggregate per metric before auto-reset
## Prevents memory overflow on long-running instances
## At 1-second sampling interval: 1000 samples ≈ 16.7 minutes
## Default: 1000
## Uncomment to change:
# Plugins.Aggplugin.MaxSamples=1000

## Preload Metrics
## Comma-separated list of metrics to preload on startup
## This solves the "cold start" problem by establishing baseline before first query
## Available metrics: cpu_load, mem_free
## Default: cpu_load,mem_free
## Uncomment to change or disable (leave empty):
# Plugins.Aggplugin.PreloadMetrics=cpu_load,mem_free

## Preload Delay
## Seconds to wait after collector starts before accepting queries
## 0 = immediate availability (may return null on very first query)
## 1-2 = wait for baseline establishment (recommended for Active mode)
## 3-5 = ensure data ready on first query (recommended for high-availability)
## Default: 0 (immediate)
## Uncomment to enable delay:
# Plugins.Aggplugin.PreloadDelay=0

### Configuration Priority:
### 1. [ZABBIX_HOME]/conf/zabbix_agent2.d/plugins.d/aggplugin.conf (Plugins.Aggplugin.*)
### 2. [ZABBIX_HOME]/conf/zabbix_agent2.conf (Plugins.Aggplugin.* or DebugLevel for global)
### 3. Hardcoded defaults in go_agent2_wrapper/main.go

### Example Paths by Platform:
### Windows (C:\Zabbix):
###   Plugins.Aggplugin.System.Path=C:\Zabbix\plugins\aggplugin-agent2.exe
### Windows (Program Files):
###   Plugins.Aggplugin.System.Path=C:\Program Files\Zabbix Agent 2\plugins\aggplugin-agent2.exe
### Linux:
###   Plugins.Aggplugin.System.Path=/usr/local/zabbix/plugins/aggplugin-agent2
