### Zabbix Agent2 - Aggplugin Configuration Template
### Deploy to: [ZABBIX_HOME]/conf/zabbix_agent2.d/plugins.d/aggplugin.conf
###
### Common Zabbix installation paths:
### - Windows: C:\Program Files\Zabbix Agent 2\conf\zabbix_agent2.d\plugins.d\
### - Windows: C:\Zabbix\conf\zabbix_agent2.d\plugins.d\
### - Linux: /etc/zabbix/zabbix_agent2.d/plugins.d/

### IMPORTANT: External plugins (standalone executables) cannot use Configure() interface
### Configuration is read by custom parser in main.go at startup
### Priority: plugin config > main agent config > hardcoded defaults

## External Plugin Registration
## Path to the external plugin executable (REQUIRED)
## Note: Must use "System.Path" parameter for external plugins
## Adjust path to match your Zabbix plugin directory:
Plugins.Aggplugin.System.Path=[ZABBIX_HOME]/plugins/aggplugin-agent2.exe

## Debug Level
## Controls verbosity of plugin logging
## Log location attempts (in order):
##   1. [ZABBIX_HOME]/log/aggplugin_debug.log
##   2. C:\Program Files\Zabbix Agent 2\log\aggplugin_debug.log
##   3. Current directory (fallback)
## Values: 0=Fatal/None, 1=Error, 2=Warning, 3=Info, 4=Verbose, 5=VeryVerbose
## Default: 0 (Fatal errors only)
## Uncomment to enable INFO level logging (recommended for troubleshooting):
Plugins.Aggplugin.DebugLevel=3

## Alternative: Set DebugLevel globally in main agent config (zabbix_agent2.conf)
## This will be read if plugin-specific setting is not defined:
# DebugLevel=3

## Maximum Samples
## Maximum number of samples to aggregate per metric before auto-reset
## Prevents memory overflow on long-running instances
## At 1-second sampling interval: 1000 samples ≈ 16.7 minutes
## Default: 1000
## Uncomment to change:
# Plugins.Aggplugin.MaxSamples=1000

## Preload Metrics
## Comma-separated list of metrics to preload on startup
## This solves the "cold start" problem by establishing baseline before first query
## Available metrics depend on loaded DLL plugins (e.g., cpu_load, mem_free, disk.io.read, disk.io.write)
## Default: cpu_load,mem_free
## Uncomment to change or disable (leave empty):
# Plugins.Aggplugin.PreloadMetrics=cpu_load,mem_free

## Preload Delay
## Seconds to wait after collector starts before accepting queries
## Allows baseline establishment and initial sample collection
## 0 = immediate availability (recommended - initial reset clears stale data)
## 1-2 = additional delay for baseline (useful for delta-based metrics)
## 3-5 = ensure multiple samples before first query
## Default: 0 (immediate with initial reset)
## Uncomment to enable delay:
# Plugins.Aggplugin.PreloadDelay=0

## Output Format
## Controls JSON output format for metric values
## Values:
##   array      - Array format (default, Zabbix-compatible)
##                Returns: [{"source":"_all","avg":3.06,"min":1.95,...},{"source":"C:",...}]
##                Matches Zabbix built-in metrics like proc.get, vfs.fs.get
##                JSONPath: $[?(@.source=="_all")].avg or $[0].avg for aggregate
##
##   nestedJSON - Nested JSON object format (legacy)
##                Returns: {"metric":"cpu_load","values":{"all":{...},"sources":{...}}}
##                JSONPath: $.values.all.avg (old format)
##
## Default: array (Zabbix-compatible format)
## Uncomment to use legacy nested format:
# Plugins.Aggplugin.OutputFormat=nestedJSON

## Sampling Intervals - Plugin-Specific (Updated December 1, 2025)
## Controls how often each plugin's metrics are sampled
## Lower values = more frequent sampling = higher precision + higher CPU usage
## Higher values = less frequent sampling = lower precision + lower CPU usage
## Format: Plugins.Aggplugin.Interval.<plugin_name> (matches DLL name without _plugin.dll suffix)

## cpu_load_plugin.dll - CPU load percentage
## Metrics: cpu_load
## Recommendation: Keep at 1.0 for responsive CPU monitoring
## Default: 1.0 (sample every second)
# Plugins.Aggplugin.Interval.cpu_load=1.0

## memory_usage_plugin.dll - Memory usage statistics
## Metrics: mem_free
## Recommendation: Keep at 1.0 for real-time memory monitoring
## Default: 1.0 (sample every second)
# Plugins.Aggplugin.Interval.memory_usage=1.0

## disk_stats_plugin.dll - Disk I/O statistics
## Metrics: disk.io.read, disk.io.write, vfs.queue.length, storage.queue.length
## Recommendation: 5.0-10.0 reduces overhead while maintaining accuracy
## Default: 5.0 (sample every 5 seconds to reduce I/O overhead)
# Plugins.Aggplugin.Interval.disk_stats=5.0

## proc_status_plugin.dll - Process and service monitoring
## Metrics: proc.running, service.status (filter required, 3+ characters)
## Recommendation: 20.0+ as these metrics change infrequently
## Default: 20.0 (sample every 20 seconds - only when filter is set)
# Plugins.Aggplugin.Interval.proc_status=20.0

### Plugin Framework Configuration (Added November 14, 2025)
## Plugin Path Pattern
## Wildcard pattern for discovering measurement plugin DLLs
## These plugins extend aggplugin with custom metrics
## Default: (none - must be configured to load plugins)
## Example:
Plugins.Aggplugin.PluginPath=C:\Zabbix\bin\plugins\*.dll

## Example Plugin DLLs (when using default path above):
## - cpu_load_plugin.dll: Provides cpu_load metric (system-wide CPU percentage)
## - memory_usage_plugin.dll: Provides mem_free metric (available physical memory in MB)
## - disk_stats_plugin.dll: Provides disk.io.read, disk.io.write (per-physical-disk I/O operations/sec)
## - proc_status_plugin.dll: Provides proc.running, service.status metrics (process and service monitoring)
##
## NOTE: Metric keys are automatically discovered from DLLs via plugin_get_info()
## No need to manually configure MetricKeys in this file
##   - RTT mode (rtt=1): Average round-trip time in milliseconds (0.0 if >50% failed)
##
## Notes:
##   - If more than 50% of pings to a target fail, it contributes 0 to the result
##   - Multiple targets: result is average across all targets
##   - Thread-safe: concurrent calls queue automatically
##   - Timeout protection: honors MaxExecutionTime setting

### Configuration Priority:
### 1. [ZABBIX_HOME]/conf/zabbix_agent2.d/plugins.d/aggplugin.conf (Plugins.Aggplugin.*)
### 2. [ZABBIX_HOME]/conf/zabbix_agent2.conf (Plugins.Aggplugin.* or DebugLevel for global)
### 3. Hardcoded defaults in go_agent2_wrapper/main.go

### Example Paths by Platform:
### Windows (C:\Zabbix):
###   Plugins.Aggplugin.System.Path=C:\Zabbix\plugins\aggplugin-agent2.exe
### Windows (Program Files):
###   Plugins.Aggplugin.System.Path=C:\Program Files\Zabbix Agent 2\plugins\aggplugin-agent2.exe
### Linux:
###   Plugins.Aggplugin.System.Path=/usr/local/zabbix/plugins/aggplugin-agent2
